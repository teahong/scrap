<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>시트 스크랩 설정</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    main { max-width: 560px; margin: 0 auto; min-height: auto; padding: 32px 20px; gap: 8px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .desc { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
    .row #status { flex: 1; }
    section { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
    h2 { font-size: 15px; margin: 0 0 6px; }
  </style>
</head>
<body>
  <main>
    <h1>시트 스크랩 설정</h1>
    <p class="desc">Apps Script 웹앱을 배포한 뒤 URL과 비밀 키를 입력하세요. 자세한 방법은 README.md에 있습니다.</p>

    <label for="scriptUrl">웹앱 URL</label>
    <input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">

    <label for="secret">비밀 키 <span class="hint">Code.gs의 SECRET 값과 같아야 합니다</span></label>
    <input id="secret" type="password" autocomplete="off">

    <div class="row">
      <p id="status" role="status"></p>
      <button id="test" type="button" class="secondary">연결 테스트</button>
      <button id="save" type="button">저장</button>
    </div>

    <section>
      <h2>전송 대기</h2>
      <p class="desc" id="queueInfo"></p>
      <div class="row">
        <p id="queueStatus"></p>
        <button id="flush" type="button" class="secondary">지금 다시 보내기</button>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
